<rect width="1200" height="350" rx="24" fill="url(#bg)"/>
<g font-family="Arial,sans-serif"><text x="48" y="54" fill="#67ddc6" font-size="14" letter-spacing="3">RESEARCH / BUILD / EVALUATE</text><text x="48" y="97" fill="#fff" font-size="30" font-weight="bold">From signals to usable software</text>
<g fill="#153149" stroke="#456177"><rect x="48" y="144" width="240" height="126" rx="16"/><rect x="347" y="144" width="240" height="126" rx="16"/><rect x="646" y="144" width="240" height="126" rx="16"/><rect x="945" y="144" width="207" height="126" rx="16"/></g>
