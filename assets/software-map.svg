<g fill="#c6d8e6" font-size="16"><text x="70" y="224">IMU / BLE / recording</text><text x="369" y="224">Web · Windows · Android</text><text x="668" y="224">Replay / visual analysis</text><text x="967" y="224">Investigate / verify</text></g>
